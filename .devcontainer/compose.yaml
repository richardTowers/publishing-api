name: publishing-api

services:
  app:
    image: ghcr.io/rails/devcontainer/images/ruby:4.0.5
    # Keep the container running; the dev container tooling execs into it.
    command: sleep infinity
    volumes:
      - ..:/IdeaProjects/publishing-api:cached
    environment:
      # database.yml reads these. Host names match the service names below.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/publishing_api_development
      TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/publishing_api_test
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
